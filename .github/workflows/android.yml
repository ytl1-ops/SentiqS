name: Application Android

# Construit l'application Android (Trusted Web Activity qui ouvre le site,
# dossier android/). Sur une PR qui touche android/, elle prouve que le projet
# compile. Lancée à la main (Actions > Application Android > Run workflow),
# elle produit aussi l'AAB à téléverser dans la Play Console, signé avec la
# clé d'envoi si les secrets existent :
#   ANDROID_KEYSTORE_BASE64  la clé (.jks) en base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Sans eux : APK de débogage seulement, pour essayer l'app sur un téléphone.

on:
  pull_request:
    paths:
      - android/**
      - .github/workflows/android.yml
  workflow_dispatch:
    inputs:
      version_code:
        description: "Numéro de version (entier, à augmenter à chaque envoi au Play Store)"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  construire:
    name: Construire l'application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: APK de débogage
        run: gradle --no-daemon assembleDebug
      - name: Clé d'envoi
        id: cle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/envoi.jks"
            echo "chemin=$RUNNER_TEMP/envoi.jks" >> "$GITHUB_OUTPUT"
          else
            echo "Pas de clé d'envoi : l'AAB ne sera pas signé."
          fi
      - name: AAB pour le Play Store
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.cle.outputs.chemin }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
        run: gradle --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sentiqs-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
