name: CI webapp

# Garde-fou né d'un incident réel : le merge de la PR #16 a repris le côté
# « revert » de la PR #15 et supprimé les 16 889 lignes de webapp/, alors que
# la branche fusionnée contenait justement le commit qui les restaurait
# (b7a554e, « Annule le rollback : restaure webapp/ »). Personne n'a vérifié
# l'arbre après fusion, et la perte est passée inaperçue.
#
# Ce workflow refuse donc toute PR — et signale tout push sur main — où
# webapp/ aurait disparu, se serait vidé de sa substance, ou ne compilerait
# plus. Il tourne sur le résultat du merge, pas seulement sur la branche.

on:
  # Aucun filtre de branche cible sur les pull requests : une PR empilee sur
  # une autre PR (base != main) n'aurait sinon AUCUNE verification, et se
  # presenterait au relecteur comme non testee. Le filtre `branches: [main]`
  # ne couvrait que les PR visant directement main.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrite:
    name: Intégrité de l'arborescence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifie que les répertoires critiques sont toujours là
        run: |
          set -euo pipefail

          # Fichiers dont la disparition signale une fusion partie de travers.
          # Un simple test de présence de webapp/ ne suffirait pas : un dossier
          # réduit à son package.json passerait.
          requis=(
            webapp/package.json
            webapp/vite.config.ts
            webapp/src/App.tsx
            webapp/src/router/config.tsx
            webapp/src/lib/supabase.ts
            webapp/src/lib/veille.ts
            webapp/src/lib/pays.ts
            webapp/src/lib/planning.ts
            webapp/src/pages/dashboard/page.tsx
            webapp/src/pages/dashboard/settings/page.tsx
            web/SentiqS_Web.html
          )

          manquants=0
          for f in "${requis[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Fichier critique absent : $f"
              manquants=$((manquants + 1))
            fi
          done

          if [ "$manquants" -gt 0 ]; then
            echo "$manquants fichier(s) critique(s) manquant(s) — fusion probablement partie du mauvais côté."
            exit 1
          fi

          # webapp/ tournait à ~74 fichiers suivis. Un seuil bas (40) laisse la
          # place aux suppressions légitimes tout en attrapant un effacement
          # massif, qui est le seul cas que ce garde-fou cherche à bloquer.
          suivis=$(git ls-files webapp | wc -l)
          echo "Fichiers suivis dans webapp/ : $suivis"
          if [ "$suivis" -lt 40 ]; then
            echo "::error::webapp/ ne contient plus que $suivis fichiers suivis (seuil : 40)."
            exit 1
          fi

          # Les manifestes de la racine doivent etre du JSON analysable.
          # Le 2 aout 2026, un depot de fichiers a remplace package.json par un
          # composant React : `npm install` a cesse de fonctionner a la racine
          # et le job de collecte planifiee a echoue en silence pendant 25
          # jours. Ce controle rend ce mode de panne impossible a repeter.
          for f in package.json tsconfig.json tsconfig.app.json tsconfig.node.json; do
            if [ -f "$f" ]; then
              if ! node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/dev/null; then
                echo "::error file=$f::$f n'est pas du JSON valide."
                exit 1
              fi
              echo "$f : JSON valide"
            fi
          done

          # Les migrations sont cumulatives : en perdre est toujours une erreur.
          migrations=$(git ls-files 'supabase/migrations/*.sql' | wc -l)
          echo "Migrations présentes : $migrations"
          if [ "$migrations" -lt 3 ]; then
            echo "::error::Seulement $migrations migration(s) — au moins 3 sont attendues."
            exit 1
          fi

          echo "Arborescence intègre."

  webapp:
    name: Build, types et lint
    runs-on: ubuntu-latest
    needs: integrite
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Installe les dépendances
        run: npm ci

      - name: Vérifie les types
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build de production
        # Les variables ne servent qu'à satisfaire l'import de src/lib/supabase.ts
        # au moment du build : aucune requête n'est émise, et les vraies valeurs
        # viennent de webapp/.env à l'exécution.
        env:
          VITE_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
          VITE_PUBLIC_SUPABASE_ANON_KEY: build-only
        run: npm run build

      - name: Refuse un build vide
        run: |
          set -euo pipefail
          test -f out/index.html || { echo "::error::out/index.html absent après le build."; exit 1; }
          if [ "$(find out/assets -name '*.js' | wc -l)" -eq 0 ]; then
            echo "::error::Aucun bundle JS produit."
            exit 1
          fi
          echo "Build vérifié."

  collecte:
    name: Moteur de collecte
    runs-on: ubuntu-latest
    needs: integrite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntaxe du JavaScript inline de production
        # web/SentiqS_Web.html n'a aucune etape de build : une erreur de
        # syntaxe n'y serait decouverte que dans le navigateur d'un visiteur.
        run: node scripts/verifier-syntaxe-html.js

      - name: Couverture des proxys par le job planifie
        # Un proxy ajoute cote application mais absent du job le ferait
        # retomber sur le proxy public, sans robots.txt ni User-Agent
        # identifiable — silencieusement.
        run: node scripts/verifier-couverture-proxys.js

      - name: Accessibilité du fichier de production
        # Un contrôle interactif sans nom accessible est inutilisable au
        # clavier comme au lecteur d'écran — trois boutons de suppression
        # étaient dans ce cas.
        run: node scripts/verifier-accessibilite.js

      - name: Pages légales
        # Bloque si une page légale publiée contient encore un emplacement
        # non complété — une conformité de façade est pire que rien.
        run: node scripts/verifier-pages-legales.js

      - name: Symetrie du dictionnaire de traduction
        # t() retombe silencieusement sur le francais quand une cle manque en
        # anglais : une cle ajoutee d'un seul cote n'echoue nulle part, elle
        # affiche du francais a un anglophone.
        run: node scripts/verifier-i18n.js

      - name: Registre des sources
        # Le seuil de fiabilite decide quelles sources peuvent declencher une
        # alerte. Un pays sans aucune source au-dessus du seuil serait
        # totalement aveugle, sans que rien ne le signale.
        run: node scripts/verifier-sources.js

      - name: Ressources referencees presentes
        # Les captures du mode d'emploi ont quitte le fichier (240 Ko de
        # base64 imposes a chaque visiteur) pour web/assets/. Un fichier
        # renomme ne casserait plus rien de visible au chargement, seulement
        # l'export PDF, et seulement quand quelqu'un l'essaie.
        run: node scripts/verifier-ressources.js

      - name: Datation des incidents verifies
        # Le niveau d'alerte affiche repose d'abord sur ALERTE_EVENTS et
        # FACTEURS_SPECIAUX, saisis a la main. Ce controle refuse une date
        # qu'aucun format connu ne couvre, et affiche l'age du socle verifie.
        run: node scripts/verifier-datation-incidents.js

      - name: Tests du moteur de collecte
        run: npm test

      - name: Fiches pays adossées à des données vérifiées
        # Le generateur refuse deja de produire du contenu surete a partir de
        # rien. Mesure du 02/09/2026 : neuf fiches publiees, quatre seulement
        # avec leur fichier de donnees — cinq avaient contourne le generateur,
        # et rien ne le signalait.
        run: node scripts/verifier-fiches-pays.js

      - name: Aucun nouveau fichier de secrets suivi par git
        # .gitignore ne protege que ce qui n'est pas DEJA suivi : webapp/.env
        # a ete ajoute avant la regle et le reste. Le retirer demande de
        # verifier Netlify d'abord — d'ou un cliquet, pas un correctif.
        run: node scripts/verifier-secrets-suivis.js

      - name: Installer le navigateur des contrôles
        # Deux controles ouvrent vraiment la page : celui d'accessibilite et
        # le test de fumee. L'installation vivait DANS l'etape du test de
        # fumee, donc apres le controle d'accessibilite — qui trouvait
        # playwright absent et se taisait. Il a fallu le durcir pour que la
        # panne devienne visible ; l'installation est maintenant explicite et
        # placee avant ses deux consommateurs.
        run: |
          npm install playwright@1 --no-save
          npx playwright install --with-deps chromium

      - name: Accessibilité de l'interface rendue
        # Mesure le DOM APRES rendu, pas le fichier source : l'essentiel de
        # cette interface est construit par JavaScript, et compter les
        # attributs dans le source ne dit rien de ce que voit un lecteur
        # d'ecran. Le 02/09/2026, cette mesure a trouve 64 champs sur 103
        # sans nom accessible, aucun repere de structure et aucun <h1>,
        # alors que la grille d'evaluation notait l'accessibilite 3 sur 5.
        run: node scripts/verifier-accessibilite-interface.js

      - name: La page de production se charge
        # Tous les autres controles LISENT le fichier sans jamais l'executer :
        # aucun ne verrait une rupture d'execution (dependance manquante,
        # script charge dans le mauvais ordre, ressource refusee par la CSP).
        # Celui-ci ouvre vraiment la page dans un navigateur.
        run: node scripts/test-fumee.js
