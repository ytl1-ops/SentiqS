name: Traduction des actus (FR/EN)

# Passage de traduction seul, entre deux collectes (scripts/traduire-cache.js).
# Demande de YORO du 19/11/2026 : une seule langue à l'écran et dans les
# rapports, et une traduction renforcée « via GitHub ». La collecte ne traduit
# que 3 min par passage ; ce job reprend l'arriéré toutes les heures, avec les
# mêmes services gratuits (Google « gtx », MyMemory), sans clé ni frais.
#
# Groupe de concurrence PROPRE : partager celui de la collecte ferait
# remplacer une collecte en attente par une traduction (GitHub ne garde qu'un
# passage en attente par groupe). Le chevauchement est géré par le script :
# il relit le cache juste avant d'écrire et reporte ses traductions sur la
# version la plus récente.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traduction-actus
  cancel-in-progress: false

jobs:
  traduire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Restaurer le navigateur Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - name: Installer Playwright + Chromium
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      # Traducteur hors ligne (22/11/2026) : depuis les runners, Google « gtx »
      # et MyMemory ne répondaient plus (0 traduction sur 766 requêtes au
      # passage de 8 h UTC). Argos Translate traduit sur le runner, sans clé
      # ni quota ; ses modèles (~100 Mo par paire) sont gardés en cache.
      # Un échec ici ne bloque rien : le script retombe sur les services en ligne.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/traducteur-local.requirements.txt
      - name: Restaurer les modèles de traduction
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-modeles-${{ runner.os }}-v1-${{ hashFiles('scripts/traducteur-local.py') }}
          restore-keys: argos-modeles-${{ runner.os }}-v1-
      - name: Installer le traducteur hors ligne
        continue-on-error: true
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r scripts/traducteur-local.requirements.txt
          python3 scripts/traducteur-local.py < /dev/null
      - name: Traduire les actus du cache partagé
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Facultatif : une adresse e-mail passée à MyMemory relève son quota
          # gratuit de 5 000 à 50 000 caractères par jour. Sans elle, rien ne change.
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: node scripts/traduire-cache.js
