name: Collecte planifiée (cache partagé)

# Déclenche une collecte RSS réelle toutes les ~30 minutes via un navigateur
# headless pointé sur l'application déployée, et publie le résultat dans le
# cache partagé Firestore (collecte_partagee) — voir scripts/collecte-planifiee.js
# et checkCollectorSession() dans web/SentiqS_Web.html.
#
# Objectif : garder ce cache quasi toujours frais, INDÉPENDAMMENT du trafic
# réel de visiteurs. Auparavant, seul un visiteur qui déclenchait lui-même
# une collecte l'alimentait ; dès qu'il expirait, le prochain visiteur
# relançait une collecte complète des ~495 sources depuis SON PROPRE
# navigateur — d'où l'impression de "collecte à chaque lancement".
#
# Cadence à 30 min (pas 15) : le premier run réel a montré que les proxys
# CORS partagés (allorigins, corsproxy.org...) rate-limitent lourdement une
# rafale de ~495 requêtes concentrées depuis UNE SEULE IP — un cycle plus
# espacé laisse le temps à ce throttling de se dissiper entre deux runs
# (voir scripts/collecte-planifiee.js, qui publie de toute façon un
# instantané partiel si la collecte n'a pas fini à temps).
#
# Ne nécessite aucun secret supplémentaire : la cible est l'URL publique
# déployée, et le jeton de session collecteur est lu directement depuis le
# fichier source (COLLECTOR_TOKEN), jamais dupliqué ici.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      rapport_mensuel:
        description: "Réécrire tout de suite la Présentation 1 (rapport mensuel de sûreté) du mois (sinon : premier passage de chaque jour)"
        type: boolean
        default: false
      identite_envoi:
        description: "Identité d'envoi du rapport (nom de l'organisation). Vide : SentiqS par défaut. Retenue pour le mois."
        type: string
        default: ''
      signature_envoi:
        description: "Ligne qui suit le nom dans le pied de page (facultatif)"
        type: string
        default: ''
      logo_envoi:
        description: "Nom du fichier logo (PNG ou JPEG) déjà posé dans scripts/config (facultatif)"
        type: string
        default: ''

permissions:
  contents: read
  issues: write

# Deux collectes qui se chevauchent se disputeraient le commit de l'archive.
# On laisse finir celle qui tourne plutot que d'annuler : elle est peut-etre
# a deux minutes d'avoir publie son cache.
concurrency:
  group: collecte-planifiee
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    # 30 = installation du navigateur (jusqu'a 5 min sans cache) + 16 min
    # d'echeance (COLLECTE_ECHEANCE_EPOCH, fixee apres l'installation) + PDF
    # (borne a 8 min) + archive + marge. A 20, le passage n° 1143 (27/10/2026)
    # a ete tue pendant l'installation de LibreOffice, avant le commit : le
    # rapport regenere n'a jamais ete publie.
    # 36 depuis le 20/11/2026 : la collecte a desormais sa propre garde (20 min,
    # etape « Lancer la collecte planifiee ») ; il reste au moins 12 min au PDF,
    # a l'index et au commit de l'archive meme quand elle la depasse.
    timeout-minutes: 36
    permissions:
      # Ecriture necessaire au seul commit de l'archive des niveaux
      # (web/historique/). Le reste du job ne touche pas au depot.
      contents: write
      issues: write
      # Declencher le deploiement Pages apres ce commit — voir l'etape
      # « Archiver l'instantane du jour » pour la raison.
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # Le navigateur est mis en cache entre deux passages. Sans cela, le
      # telechargement de Chromium prend d'ordinaire 30 s mais parfois plus de
      # 7 min (passages n° 812 et 814, les 03 et 04/09/2026) : avec la
      # collecte de 11 min qui suivait, le job depassait sa garde de 18 min et
      # etait tue AVANT de publier — un cycle entier perdu, et perdu en
      # silence puisque « annule » n'est pas « echoue » (voir le job d'alerte).
      - name: Restaurer le navigateur Playwright
        id: cache-navigateur
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Installer Playwright + Chromium
        run: |
          npm install playwright@1 pptxgenjs@3.12.0 docx@8.5.0
          npx playwright install --with-deps chromium

      # Echeance absolue du passage, lue par scripts/collecte-planifiee.js :
      # si l'installation a ete lente, la fenetre de collecte se raccourcit
      # d'autant au lieu de laisser la garde du job tuer la publication.
      - name: Fixer l'échéance du passage
        run: echo "COLLECTE_ECHEANCE_EPOCH=$(( $(date +%s) + 16*60 ))" >> "$GITHUB_ENV"

      - name: Vérifie que la racine est utilisable par npm
        # Cause de la panne du 02/08/2026 au 27/08/2026 : un package.json
        # corrompu a la racine faisait echouer `npm install` avant meme la
        # collecte. Echouer ici donne un message explicite plutot qu'une
        # erreur EJSONPARSE noyee dans les journaux npm.
        run: |
          set -euo pipefail
          if [ -f package.json ] && ! node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))" 2>/dev/null; then
            echo "::error file=package.json::package.json n'est pas du JSON valide — npm ne peut pas travailler a la racine."
            exit 1
          fi

      - name: Restaurer la mémoire inter-runs de collecte
        # SRC_HEALTH / PROXY_HEALTH_PAYS (voir scripts/lib/sante-collecte.js)
        # : un petit etat qui doit survivre entre executions ephemeres SANS
        # toucher au depot (pas de commit — voir l'avertissement explicite
        # dans scripts/lib/historique.js sur le bruit d'un commit a chaque
        # run) ni a Supabase (changement de schema en production, hors
        # perimetre sans le proprietaire). Cle glissante : chaque run
        # sauvegarde sous une cle UNIQUE (son run id, ci-dessous), et
        # restore-keys reprend ici la plus recente existante — jamais de
        # collision, jamais besoin d'ecraser une cle existante.
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .cache-sante
          key: sante-collecte-${{ github.run_id }}
          restore-keys: |
            sante-collecte-

      - name: Lancer la collecte planifiée
        # Garde propre a l'etape (20/11/2026). Une etape qui depasse sa garde
        # ECHOUE, elle n'annule pas le job : les etapes suivantes en
        # !cancelled() (PDF, index, archive, bulletins) s'executent quand
        # meme. Passages 1239 a 1243 : la garde du job a annule le tout, et
        # l'archive comme les bulletins publics sont restes figes au 18/11.
        timeout-minutes: 20
        env:
          GRSCI_FORCER: ${{ inputs.rapport_mensuel && '1' || '' }}
          RAPPORT_IDENTITE: ${{ inputs.identite_envoi }}
          RAPPORT_SIGNATURE: ${{ inputs.signature_envoi }}
          RAPPORT_LOGO: ${{ inputs.logo_envoi }}
          # Cible : le miroir Firebase Hosting (sentiqs-235ce), publié par le
          # job « firebase » de gh-pages-deploy.yml à chaque push et à chaque
          # archive. Le 24/11/2026 vers 19 h 30 UTC le dépôt est passé en
          # privé : GitHub Pages ne sert plus rien (« There isn't a GitHub
          # Pages site here »), la page ne chargeait plus, la session
          # collecteur ne s'ouvrait jamais (« waitForFunction: Timeout ») et
          # 46 passages d'affilée ont échoué, cache figé au 24/11 19 h 18.
          # Firebase sert la même page, quel que soit l'état de Pages.
          SENTINEL_URL: https://sentiqs-235ce.web.app/SentiqS_Web.html
          # Canal d'alerte sortant : URL d'un webhook entrant Slack, d'un
          # connecteur Teams, ou de n'importe quel relais acceptant
          # {"text": "..."}. OPTIONNEL — sans lui, le job calcule quand meme
          # les changements de niveau et journalise le message qui SERAIT
          # parti, ce qui permet de mesurer le bruit avant de brancher quoi
          # que ce soit. A definir dans Settings > Secrets and variables >
          # Actions. Ne jamais l'ecrire dans le depot : une URL de webhook
          # est une capacite d'ecriture sur le canal, pas une simple adresse.
          WEBHOOK_ALERTES: ${{ secrets.WEBHOOK_ALERTES }}
          # Repli sans secret (22/11/2026) : sans webhook, le flash part en
          # commentaire du ticket « Flash sûreté » (GitHub prévient le
          # propriétaire par e-mail). Le job a déjà issues: write.
          GITHUB_TOKEN: ${{ github.token }}
          # Compte de service Firebase (JSON du projet sentiqs-235ce) : seule
          # destination du cache d'actus et de l'agenda depuis le 15/11/2026
          # (Supabase retire). Sans lui la publication echoue. Voir
          # FIREBASE.md. Jamais ecrit dans le depot.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Facultatif : relève le quota gratuit de MyMemory (voir traduction-job.js).
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: node scripts/collecte-planifiee.js

      - name: Sauvegarder la mémoire inter-runs de collecte
        # if: always() — un run qui échoue plus loin (publication, archive)
        # a quand meme APPRIS quelque chose sur les sources/proxys pendant
        # sa collecte (scripts/collecte-planifiee.js l'ecrit dans
        # .cache-sante/ des la fin de la collecte, avant tout risque
        # d'echec ulterieur) ; le perdre reviendrait a repartir de zero pour
        # rien. Cle = run id courant (voir l'etape de restauration
        # ci-dessus) : jamais de collision avec une cle existante, donc
        # jamais besoin d'overwrite.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache-sante
          key: sante-collecte-${{ github.run_id }}

      - name: Vérifie la fraîcheur du cache publié
        # La collecte peut "reussir" sans rien publier d'utile. On verifie
        # donc l'effet, pas seulement l'absence d'erreur.
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/verifier-fraicheur-cache.js

      - name: PDF du rapport mensuel de sûreté
        # Le PDF est le PowerPoint du mois converti par LibreOffice : mêmes
        # pages, mêmes couleurs. Seulement quand le PDF manque ou que le PowerPoint
        # vient d'être réécrit (premier passage de chaque jour : le rapport du
        # mois est tenu à jour sur sa période), pour ne pas installer
        # LibreOffice à chaque passage. Un échec ne fait pas échouer la
        # collecte : le PowerPoint et le Word sont déjà écrits.
        # !cancelled() et non success() : le 28/10/2026 la publication du cache
        # partage a ete refusee par Supabase (402, quota de transfert depasse)
        # APRES l'ecriture du PowerPoint et du Word. Le job est sorti en erreur,
        # et success() a fait sauter le PDF, l'index et le commit : le rapport,
        # qui ne depend pas de Supabase, n'a jamais ete publie. Le job reste
        # rouge (l'echec de publication doit se voir), mais ce qui est ecrit
        # localement est archive quand meme.
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -euo pipefail
          cd web/rapports/mensuel 2>/dev/null || exit 0
          for f in 20??-??.pptx; do
            [ -f "$f" ] || continue
            if [ ! -f "${f%.pptx}.pdf" ] || [ -n "$(git status --porcelain -- "$f")" ]; then
              sudo apt-get install -y --no-install-recommends libreoffice-impress fonts-liberation >/dev/null
              soffice --headless --convert-to pdf "$f" >/dev/null
            fi
          done

      - name: Index des rapports mensuels
        # Separe du PDF : un PDF en echec ou borne par le delai ne doit pas
        # empecher le PowerPoint et le Word d'apparaitre dans le module Rapports.
        # !cancelled() : voir l'etape du PDF (publication Supabase refusee le 28/10).
        if: ${{ !cancelled() }}
        run: node scripts/indexer-rapports-grsci.js

      - name: Rapport du mois en cours dans sa release
        # Choix de YORO du 22/11/2026 (« version finale seule dans Git ») : le
        # rapport du mois en cours (~24 Mo) était recommité chaque jour et
        # chaque version restait dans l'historique, ~700 Mo par mois. Il est
        # désormais déposé dans la release rapport-AAAA-MM (remplacé chaque
        # jour, sans historique) et retiré de l'arbre ; seule la version finale
        # d'un mois clos est commitée. En cas d'échec les fichiers restent et
        # sont commités comme avant (scripts/publier-rapport-release.js).
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publier-rapport-release.js

      - name: Fichiers statiques de l'agent (faits, agenda, validations)
        # Contenu commun lu par tous les comptes, servi sans lecture Firestore
        # (audit de capacité du 22/11/2026). Voir scripts/lib/exporter-statiques.js.
        if: ${{ !cancelled() }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/exporter-statiques.js

      - name: Archiver l'instantané du jour
        # Un instantané par jour, écrit par le premier passage (voir
        # scripts/lib/historique.js), plus l'état de dédoublonnage des
        # alertes sortantes (dernier-signale.json), qui lui ne bouge que
        # lorsqu'un niveau change. Les passages sans changement ne trouvent
        # rien à commiter et sortent — d'où le test de diff.
        #
        # Le rebase avant push est là pour le cas où un déploiement Pages ou
        # une fusion serait arrivé pendant les huit minutes de collecte :
        # perdre l'archive du jour pour un conflit de fast-forward serait
        # absurde, et la relancer coûte un cycle entier.
        # !cancelled() : voir l'etape du PDF (publication Supabase refusee le 28/10).
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRSCI_FORCER: ${{ inputs.rapport_mensuel && '1' || '' }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain --untracked-files=all web/historique web/bulletins web/rapports web/agent)" ]; then
            echo "Rien de neuf dans l'archive — journée déjà couverte."
            exit 0
          fi
          # Cadence de 30 min (22/11/2026, voir le job « relance ») : sans
          # garde, le cumul du mois (faits-AAAA-MM.json, ~1 Mo réécrit à chaque
          # passage) et l'index des bulletins seraient commités 48 fois par
          # jour. On commite toujours ce qui ne doit pas attendre — l'état des
          # alertes sortantes (web/historique : sans lui le passage suivant
          # réannoncerait le même changement), un fichier nouveau (instantané
          # ou bulletins du jour), un rapport forcé — et le reste au plus une
          # fois toutes les trois heures, la cadence d'avant. Un fait vu par un
          # passage non commité reste dans les flux et le cache de 36 h : le
          # passage commité suivant le reprend.
          if [ -z "$(git status --porcelain web/historique)" ] \
             && [ -z "$(git status --porcelain web/agent/validations.json)" ] \
             && [ -z "$(git status --porcelain --untracked-files=all web/bulletins web/rapports web/agent | grep '^??' || true)" ] \
             && [ "${GRSCI_FORCER:-}" != "1" ]; then
            dernier=$(git log -1 --format=%ct --author=collecte-planifiee -- web/rapports web/bulletins web/agent 2>/dev/null || echo 0)
            if [ -n "$dernier" ] && [ $(( $(date +%s) - ${dernier:-0} )) -lt 10800 ]; then
              echo "Cumul et bulletins déjà commités il y a moins de 3 h — gardés pour le passage suivant."
              exit 0
            fi
          fi
          git config user.name  "collecte-planifiee[bot]"
          git config user.email "collecte-planifiee@users.noreply.github.com"
          git add web/historique
          # Faits, agenda et validations de l'agent, en fichiers statiques.
          [ -d web/agent ] && git add web/agent
          # Bulletin quotidien des pays pilotes (scripts/lib/bulletin.js).
          [ -d web/bulletins ] && git add web/bulletins
          # Rapport mensuel de sûreté (scripts/lib/rapport-grsci.js).
          [ -d web/rapports ] && git add web/rapports
          jour=$(date -u +%Y-%m-%d)
          git commit -m "Archive des niveaux d'alerte du $jour"
          for essai in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Archive du $jour poussée."
              # GitHub ne declenche AUCUN workflow sur un push fait avec le
              # GITHUB_TOKEN d'un job — garde-fou anti-recursion. Le
              # deploiement Pages ne partait donc jamais pour une archive :
              # le fichier que l'interface telecharge restait fige jusqu'a
              # la fusion humaine suivante.
              #
              # Constate le 03/09/2026 : main portait les releves du 2 ET du
              # 3 septembre, le site public servait encore le seul releve du
              # 2. Aucun des cinq commits d'archive du bot n'avait declenche
              # de deploiement ; les archives n'arrivaient a l'utilisateur
              # que par raccroc, poussees par la fusion d'une PR sans rapport.
              #
              # Consequence directe sur ce que voit un professionnel : la
              # fleche de tendance a besoin de DEUX releves. Tant que le site
              # n'en sert qu'un, elle ne s'affiche pour personne.
              #
              # workflow_dispatch est l'exception documentee a ce garde-fou :
              # un workflow declenche par l'API avec le GITHUB_TOKEN part
              # bien. On ne fait pas echouer le run si l'appel echoue —
              # l'archive, elle, est deja poussee.
              gh workflow run gh-pages-deploy.yml --ref main \
                && echo "Déploiement Pages déclenché pour l'archive du $jour." \
                || echo "::warning::Archive poussée mais déploiement Pages non déclenché."
              exit 0
            fi
            echo "Push refusé (essai $essai) — rebase puis nouvelle tentative."
            # --autostash : l'installation npm modifie package.json et le verrou
            # dans l'arbre ; sans cela le rebase refusait (run 1098 du 20/10/2026,
            # le rapport mensuel était commité mais jamais poussé).
            git pull --rebase --autostash origin main
            sleep $((essai * 4))
          done
          echo "::warning::Archive du $jour non poussée après trois tentatives."


  # ── Relance du passage suivant (22/11/2026) ──────────────────────────────
  # Le cron « */30 » est étranglé par GitHub : passages réels n° 1245 à 1252
  # espacés de 4 à 8 h (13 h 26, 21 h 25, 02 h 41, 10 h 41, 17 h 52, 22 h 49,
  # 02 h 50, 10 h 47 UTC). Au-delà de six heures
  # (COLLECTE_PARTAGEE_LECTURE_MAX_MS), chaque visiteur relançait sa propre
  # collecte à travers les relais publics : 0 à 45 s d'attente puis plusieurs
  # minutes. Et un flux RSS ne garde que ses N derniers articles : à 6 h
  # d'écart, ce qui en était sorti entre deux passages n'était jamais lu.
  #
  # Chaque passage relance donc le suivant par workflow_dispatch (exception
  # documentée au garde-fou du GITHUB_TOKEN, déjà utilisée pour Pages), après
  # avoir attendu que COLLECTE_CADENCE_MIN (30 par défaut) se soient écoulées
  # depuis son début. Le groupe de concurrence ne garde qu'un passage en
  # attente : si le cron en ajoute un, les deux chaînes se fondent en une. Le
  # cron reste le filet qui relance la chaîne si elle casse.
  # Arrêt : variable de dépôt COLLECTE_CHAINEE = 0. Dépôt public : les
  # minutes d'Actions de l'attente ne coûtent rien.
  relance:
    name: Relancer le passage suivant
    runs-on: ubuntu-latest
    needs: collecte
    # Variable absente = null, et GitHub compare null à '0' en nombres
    # (null → 0, '0' → 0) : « vars.X != '0' » était FAUX sans variable, et le
    # job a été ignoré à chaque passage du 22 au 24/11/2026 (n° 1254 à 1258,
    # espacés de 6 à 12 h). Le repli « || 'oui' » garde une chaîne.
    if: always() && github.ref == 'refs/heads/main' && (vars.COLLECTE_CHAINEE || 'oui') != '0'
    timeout-minutes: 32
    permissions:
      actions: write
    steps:
      - name: Attendre la cadence puis relancer
        env:
          GH_TOKEN: ${{ github.token }}
          CADENCE_MIN: ${{ vars.COLLECTE_CADENCE_MIN || '30' }}
        run: |
          set -euo pipefail
          debut=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          ecoule=$(( $(date +%s) - $(date -d "$debut" +%s) ))
          attente=$(( CADENCE_MIN * 60 - ecoule ))
          [ "$attente" -lt 0 ] && attente=0
          [ "$attente" -gt 1680 ] && attente=1680
          echo "Passage commencé à $debut, il y a $ecoule s ; relance dans $attente s."
          sleep "$attente"
          gh workflow run collecte-planifiee.yml -R "$GITHUB_REPOSITORY" --ref main \
            && echo "Passage suivant demandé." \
            || echo "::warning::Relance non demandée — le cron prendra le relais."

  alerte:
    name: Signaler l'échec
    runs-on: ubuntu-latest
    needs: collecte
    # cancelled() : un job tue par sa garde de temps n'est pas « en echec » pour
    # GitHub, et deux cycles ont ete perdus sans un mot les 03 et 04/09/2026.
    # always() + resultat : le 20/11/2026, cinq passages annules par la garde
    # du job n'ont declenche aucune alerte (job « skipped ») avec
    # failure() || cancelled().
    if: always() && needs.collecte.result != 'success'
    permissions:
      issues: write
    steps:
      # Sans ce signal, l'echec passe inapercu : c'est exactement ce qui a
      # laisse la collecte a l'arret 25 jours. Une seule issue ouverte a la
      # fois — on commente celle qui existe plutot que d'en creer une par run
      # (48 runs/jour).
      - name: Ouvrir ou mettre à jour une issue d'incident
        uses: actions/github-script@v8
        with:
          script: |
            const titre = 'Collecte planifiée en échec';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'collecte-en-panne',
            });
            const corps = `La collecte planifiée a échoué : ${url}\n\nLe cache partagé n'est plus rafraîchi tant que ce point n'est pas résolu.`;
            if (ouvertes.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ouvertes.data[0].number, body: corps,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titre, body: corps, labels: ['collecte-en-panne'],
              });
            }
