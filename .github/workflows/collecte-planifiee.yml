name: Collecte planifiée (cache partagé)

# Déclenche une collecte RSS réelle toutes les ~30 minutes via un navigateur
# headless pointé sur l'application déployée, et publie le résultat dans le
# cache partagé Supabase (collecte_partagee) — voir scripts/collecte-planifiee.js
# et checkCollectorSession() dans web/SentiqS_Web.html.
#
# Objectif : garder ce cache quasi toujours frais, INDÉPENDAMMENT du trafic
# réel de visiteurs. Auparavant, seul un visiteur qui déclenchait lui-même
# une collecte l'alimentait ; dès qu'il expirait, le prochain visiteur
# relançait une collecte complète des ~495 sources depuis SON PROPRE
# navigateur — d'où l'impression de "collecte à chaque lancement".
#
# Cadence à 30 min (pas 15) : le premier run réel a montré que les proxys
# CORS partagés (allorigins, corsproxy.org...) rate-limitent lourdement une
# rafale de ~495 requêtes concentrées depuis UNE SEULE IP — un cycle plus
# espacé laisse le temps à ce throttling de se dissiper entre deux runs
# (voir scripts/collecte-planifiee.js, qui publie de toute façon un
# instantané partiel si la collecte n'a pas fini à temps).
#
# Ne nécessite aucun secret supplémentaire : la cible est l'URL publique
# déployée, et le jeton de session collecteur est lu directement depuis le
# fichier source (COLLECTOR_TOKEN), jamais dupliqué ici.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Deux collectes qui se chevauchent se disputeraient le commit de l'archive.
# On laisse finir celle qui tourne plutot que d'annuler : elle est peut-etre
# a deux minutes d'avoir publie son cache.
concurrency:
  group: collecte-planifiee
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Ecriture necessaire au seul commit de l'archive des niveaux
      # (web/historique/). Le reste du job ne touche pas au depot.
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Playwright + Chromium
        run: |
          npm install playwright@1
          npx playwright install --with-deps chromium

      - name: Vérifie que la racine est utilisable par npm
        # Cause de la panne du 02/08/2026 au 27/08/2026 : un package.json
        # corrompu a la racine faisait echouer `npm install` avant meme la
        # collecte. Echouer ici donne un message explicite plutot qu'une
        # erreur EJSONPARSE noyee dans les journaux npm.
        run: |
          set -euo pipefail
          if [ -f package.json ] && ! node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))" 2>/dev/null; then
            echo "::error file=package.json::package.json n'est pas du JSON valide — npm ne peut pas travailler a la racine."
            exit 1
          fi

      - name: Lancer la collecte planifiée
        env:
          # Firebase Hosting retire (voir suppression du workflow
          # firebase-hosting-deploy.yml) — GitHub Pages est desormais
          # l'unique hebergement reellement mis a jour a chaque push.
          # L'ancienne cible sentinel-surete.web.app ne recoit plus aucun
          # deploiement depuis ce changement et aurait fini par servir une
          # version figee/perimee de l'app a ce job planifie.
          SENTINEL_URL: https://ytl1-ops.github.io/SentiqS/SentiqS_Web.html
          # Jeton de publication vers la fonction Edge publier-collecte.
          # Optionnel tant que la migration de verrouillage n'est pas
          # appliquee : sans lui, le job publie par ecriture directe et le
          # signale dans ses journaux. A definir dans Settings > Secrets and
          # variables > Actions, avec la MEME valeur que le secret de la
          # fonction Edge.
          COLLECTEUR_JETON: ${{ secrets.COLLECTEUR_JETON }}
          # Canal d'alerte sortant : URL d'un webhook entrant Slack, d'un
          # connecteur Teams, ou de n'importe quel relais acceptant
          # {"text": "..."}. OPTIONNEL — sans lui, le job calcule quand meme
          # les changements de niveau et journalise le message qui SERAIT
          # parti, ce qui permet de mesurer le bruit avant de brancher quoi
          # que ce soit. A definir dans Settings > Secrets and variables >
          # Actions. Ne jamais l'ecrire dans le depot : une URL de webhook
          # est une capacite d'ecriture sur le canal, pas une simple adresse.
          WEBHOOK_ALERTES: ${{ secrets.WEBHOOK_ALERTES }}
        run: node scripts/collecte-planifiee.js

      - name: Vérifie la fraîcheur du cache publié
        # La collecte peut "reussir" sans rien publier d'utile. On verifie
        # donc l'effet, pas seulement l'absence d'erreur.
        run: node scripts/verifier-fraicheur-cache.js

      - name: Archiver l'instantané du jour
        # Un instantané par jour, écrit par le premier passage (voir
        # scripts/lib/historique.js), plus l'état de dédoublonnage des
        # alertes sortantes (dernier-signale.json), qui lui ne bouge que
        # lorsqu'un niveau change. Les passages sans changement ne trouvent
        # rien à commiter et sortent — d'où le test de diff.
        #
        # Le rebase avant push est là pour le cas où un déploiement Pages ou
        # une fusion serait arrivé pendant les huit minutes de collecte :
        # perdre l'archive du jour pour un conflit de fast-forward serait
        # absurde, et la relancer coûte un cycle entier.
        if: success()
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain web/historique)" ]; then
            echo "Rien de neuf dans l'archive — journée déjà couverte."
            exit 0
          fi
          git config user.name  "collecte-planifiee[bot]"
          git config user.email "collecte-planifiee@users.noreply.github.com"
          git add web/historique
          jour=$(date -u +%Y-%m-%d)
          git commit -m "Archive des niveaux d'alerte du $jour"
          for essai in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Archive du $jour poussée."
              exit 0
            fi
            echo "Push refusé (essai $essai) — rebase puis nouvelle tentative."
            git pull --rebase origin main
            sleep $((essai * 4))
          done
          echo "::warning::Archive du $jour non poussée après trois tentatives."


  alerte:
    name: Signaler l'échec
    runs-on: ubuntu-latest
    needs: collecte
    if: failure()
    permissions:
      issues: write
    steps:
      # Sans ce signal, l'echec passe inapercu : c'est exactement ce qui a
      # laisse la collecte a l'arret 25 jours. Une seule issue ouverte a la
      # fois — on commente celle qui existe plutot que d'en creer une par run
      # (48 runs/jour).
      - name: Ouvrir ou mettre à jour une issue d'incident
        uses: actions/github-script@v7
        with:
          script: |
            const titre = 'Collecte planifiée en échec';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ouvertes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'collecte-en-panne',
            });
            const corps = `La collecte planifiée a échoué : ${url}\n\nLe cache partagé n'est plus rafraîchi tant que ce point n'est pas résolu.`;
            if (ouvertes.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ouvertes.data[0].number, body: corps,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titre, body: corps, labels: ['collecte-en-panne'],
              });
            }
