name: Sonde Mistral (traduction)

# Mesure depuis GitHub le repli de traduction par Mistral
# (scripts/lib/mistral.js, 20/11/2026). Informative : n'échoue jamais.
# Sans secret MISTRAL_API_KEY, elle le dit et s'arrête.
on:
  pull_request:
    paths:
      - 'scripts/lib/mistral.js'
      - 'scripts/sonde-mistral.js'
      - '.github/workflows/sonde-mistral.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Traduire trois titres
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node scripts/sonde-mistral.js
