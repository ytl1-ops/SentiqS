name: Déploiement webapp/ sur Netlify

# Build et déploie webapp/ (React/Vite, projet de test) vers Netlify à
# chaque push touchant webapp/, ou manuellement depuis l'onglet Actions.
# Exécuté par un runner GitHub (accès réseau complet) plutôt que
# localement, pour la même raison que scripts/collecte-planifiee.js :
# aucun accès direct à api.netlify.com/supabase.co depuis un bac à sable
# de développement.
#
# Prérequis (à faire une seule fois, dans Settings > Secrets and
# variables > Actions du dépôt) :
#   - NETLIFY_AUTH_TOKEN : jeton personnel Netlify (User settings >
#     Applications > New access token sur app.netlify.com)
#   - NETLIFY_SITE_ID    : 22351069-bba2-4242-bf41-83be0297fe8c
#     (site "sentiqs-webapp-test", déjà créé — équipe yorot225)
on:
  push:
    branches: [claude/config-review-modify-zrk95q, main]
    paths: [webapp/**]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: webapp/out
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Déploiement automatique — ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
