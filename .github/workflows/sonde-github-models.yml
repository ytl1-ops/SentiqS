name: Sonde GitHub Models (traduction)

# Mesure, depuis GitHub, que l'API de modèles gratuite répond au jeton du job
# (scripts/lib/github-models.js, 20/11/2026). Informative : n'échoue jamais
# une PR. Trois requêtes par lancement, sur le quota gratuit du dépôt.
on:
  pull_request:
    paths:
      - 'scripts/lib/github-models.js'
      - 'scripts/sonde-github-models.js'
      - '.github/workflows/sonde-github-models.yml'
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Traduire trois titres types
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sonde-github-models.js
