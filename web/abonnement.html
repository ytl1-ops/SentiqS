<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://firestore.googleapis.com; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>SentiqS — Bulletins sûreté</title>
<style>
  :root{color-scheme:light}
  body{margin:0;background:#F3F4F6;color:#1F2937;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  main{max-width:560px;margin:0 auto;padding:32px 16px}
  .carte{background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:22px 20px}
  .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#4B5563}
  h1{font:700 24px/1.25 Georgia,"Source Serif 4",serif;margin:6px 0 10px}
  p{margin:0 0 12px}
  .ok{color:#0F4F2A;font-weight:700}.err{color:#8B1A1A;font-weight:700}
  a{color:#7A4A12}
</style>
</head>
<body>
<main>
  <div class="carte" role="status" aria-live="polite">
    <div class="tag">SentiqS</div>
    <h1 id="titre">Bulletins sûreté</h1>
    <p id="message">Enregistrement de votre réponse…</p>
    <p id="aide"></p>
  </div>
</main>
<script src="js/firebase-config.js"></script>
<script src="js/abonnement.js"></script>
</body>
</html>
